<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Dataset - AI Financial Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dark-theme.css') }}">
    <style>
        .upload-container {
            max-width: 800px;
            margin: 4rem auto;
            padding: 0 var(--space-md);
        }
        
        .upload-header {
            text-align: center;
            margin-bottom: var(--space-2xl);
        }
        
        .upload-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: var(--space-sm);
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .upload-subtitle {
            color: var(--text-secondary);
            font-size: 1.125rem;
        }
        
        .upload-card {
            background: rgba(5, 8, 16, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(6, 182, 212, 0.2);
            border-radius: var(--radius-lg);
            padding: var(--space-2xl);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        .form-group {
            margin-bottom: var(--space-xl);
        }
        
        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: var(--space-sm);
            color: var(--text-primary);
        }
        
        .form-input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(6, 182, 212, 0.2);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
        }
        
        .drag-drop-area {
            border: 2px dashed rgba(6, 182, 212, 0.3);
            border-radius: var(--radius-lg);
            padding: var(--space-2xl);
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .drag-drop-area:hover {
            border-color: var(--accent-primary);
            background: rgba(6, 182, 212, 0.05);
        }
        
        .drag-drop-area.dragover {
            border-color: var(--accent-primary);
            background: rgba(6, 182, 212, 0.1);
            transform: scale(1.02);
        }
        
        .upload-icon {
            font-size: 4rem;
            margin-bottom: var(--space-md);
            opacity: 0.6;
        }
        
        .drag-drop-text {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: var(--space-sm);
        }
        
        .drag-drop-hint {
            font-size: 0.875rem;
            color: var(--text-tertiary);
        }
        
        .file-types {
            display: flex;
            justify-content: center;
            gap: var(--space-md);
            margin-top: var(--space-md);
        }
        
        .file-type-badge {
            padding: 0.5rem 1rem;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--accent-primary);
        }
        
        .file-input {
            display: none;
        }
        
        .selected-file {
            margin-top: var(--space-md);
            padding: var(--space-md);
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: var(--radius-md);
            display: none;
        }
        
        .selected-file.show {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .file-info {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }
        
        .file-icon {
            font-size: 1.5rem;
        }
        
        .file-details {
            display: flex;
            flex-direction: column;
        }
        
        .file-name {
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .file-size {
            font-size: 0.875rem;
            color: var(--text-tertiary);
        }
        
        .remove-file {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }
        
        .remove-file:hover {
            transform: scale(1.2);
        }
        
        .progress-container {
            margin-top: var(--space-lg);
            display: none;
        }
        
        .progress-container.show {
            display: block;
        }
        
        .progress-bar-wrapper {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: var(--space-sm);
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            width: 0%;
            transition: width 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .progress-text {
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        .submit-btn {
            width: 100%;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(6, 182, 212, 0.4);
        }
        
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .submit-btn:hover:not(:disabled)::before {
            left: 100%;
        }
        
        .alert {
            padding: var(--space-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-lg);
            display: none;
        }
        
        .alert.show {
            display: block;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--success);
        }
        
        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--danger);
        }
        
        .alert-icon {
            font-size: 1.5rem;
            margin-right: var(--space-sm);
        }
        
        .success-animation {
            display: none;
            text-align: center;
            padding: var(--space-2xl);
        }
        
        .success-animation.show {
            display: block;
        }
        
        .checkmark {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: inline-block;
            stroke-width: 3;
            stroke: var(--success);
            stroke-miterlimit: 10;
            box-shadow: inset 0px 0px 0px var(--success);
            animation: fill 0.4s ease-in-out 0.4s forwards, scale 0.3s ease-in-out 0.9s both;
            margin-bottom: var(--space-md);
        }
        
        .checkmark-circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 3;
            stroke-miterlimit: 10;
            stroke: var(--success);
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }
        
        .checkmark-check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }
        
        @keyframes stroke {
            100% {
                stroke-dashoffset: 0;
            }
        }
        
        @keyframes scale {
            0%, 100% {
                transform: none;
            }
            50% {
                transform: scale3d(1.1, 1.1, 1);
            }
        }
        
        @keyframes fill {
            100% {
                box-shadow: inset 0px 0px 0px 30px var(--success);
            }
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent-primary);
            text-decoration: none;
            margin-bottom: var(--space-lg);
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            transform: translateX(-5px);
        }
    </style>
</head>
<body>
    <div class="upload-container">
        <a href="/" class="back-link">
            <span>←</span>
            <span>Back to Home</span>
        </a>
        
        <div class="upload-header">
            <h1 class="upload-title">Upload Dataset</h1>
            <p class="upload-subtitle">Upload your financial time-series data for automated ML analysis</p>
        </div>
        
        <div class="upload-card">
            <div id="alertContainer"></div>
            
            <div id="uploadForm">
                <form id="datasetForm" enctype="multipart/form-data">
                    <div class="form-group">
                        <label class="form-label" for="datasetName">Dataset Name</label>
                        <input 
                            type="text" 
                            id="datasetName" 
                            name="dataset_name" 
                            class="form-input" 
                            placeholder="e.g., AAPL_2024, SP500_Historical"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Upload File</label>
                        <div class="drag-drop-area" id="dragDropArea">
                            <div class="upload-icon">📊</div>
                            <div class="drag-drop-text">Drag & drop your file here</div>
                            <div class="drag-drop-hint">or click to browse</div>
                            <div class="file-types">
                                <span class="file-type-badge">CSV</span>
                                <span class="file-type-badge">XLSX</span>
                                <span class="file-type-badge">PDF</span>
                            </div>
                            <input 
                                type="file" 
                                id="fileInput" 
                                name="file" 
                                class="file-input" 
                                accept=".csv,.xlsx,.pdf"
                                required
                            >
                        </div>
                        
                        <div class="selected-file" id="selectedFile">
                            <div class="file-info">
                                <span class="file-icon" id="fileIcon">📄</span>
                                <div class="file-details">
                                    <span class="file-name" id="fileName"></span>
                                    <span class="file-size" id="fileSize"></span>
                                </div>
                            </div>
                            <button type="button" class="remove-file" id="removeFile">×</button>
                        </div>
                    </div>
                    
                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bar-wrapper">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                        <div class="progress-text" id="progressText">Processing...</div>
                    </div>
                    
                    <button type="submit" class="submit-btn" id="submitBtn">
                        Upload & Train Model
                    </button>
                </form>
            </div>
            
            <div class="success-animation" id="successAnimation">
                <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                    <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                    <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
                <h2 style="color: var(--success); margin-bottom: var(--space-sm);">Success!</h2>
                <p style="color: var(--text-secondary); margin-bottom: var(--space-lg);">
                    Dataset uploaded and model trained successfully
                </p>
                <a href="/dashboard" class="btn btn-primary">Go to Dashboard</a>
            </div>
        </div>
    </div>
    
    <script>
        const dragDropArea = document.getElementById('dragDropArea');
        const fileInput = document.getElementById('fileInput');
        const selectedFile = document.getElementById('selectedFile');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const fileIcon = document.getElementById('fileIcon');
        const removeFile = document.getElementById('removeFile');
        const datasetForm = document.getElementById('datasetForm');
        const submitBtn = document.getElementById('submitBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const alertContainer = document.getElementById('alertContainer');
        const uploadForm = document.getElementById('uploadForm');
        const successAnimation = document.getElementById('successAnimation');
        
        // Drag and drop handlers
        dragDropArea.addEventListener('click', () => fileInput.click());
        
        dragDropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dragDropArea.classList.add('dragover');
        });
        
        dragDropArea.addEventListener('dragleave', () => {
            dragDropArea.classList.remove('dragover');
        });
        
        dragDropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dragDropArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                displaySelectedFile(files[0]);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                displaySelectedFile(e.target.files[0]);
            }
        });
        
        removeFile.addEventListener('click', () => {
            fileInput.value = '';
            selectedFile.classList.remove('show');
        });
        
        function displaySelectedFile(file) {
            const icons = {
                'csv': '📊',
                'xlsx': '📈',
                'pdf': '📄'
            };
            
            const ext = file.name.split('.').pop().toLowerCase();
            fileIcon.textContent = icons[ext] || '📄';
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            selectedFile.classList.add('show');
        }
        
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }
        
        function showAlert(message, type) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} show`;
            alert.innerHTML = `
                <span class="alert-icon">${type === 'success' ? '✓' : '✗'}</span>
                <span>${message}</span>
            `;
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alert);
        }
        
        // Form submission
        datasetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(datasetForm);
            
            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            
            // Show progress
            progressContainer.classList.add('show');
            progressBar.style.width = '10%';
            progressText.textContent = 'Uploading file...';
            
            try {
                // Simulate progress
                let progress = 10;
                const progressInterval = setInterval(() => {
                    progress += 5;
                    if (progress <= 90) {
                        progressBar.style.width = progress + '%';
                    }
                }, 200);
                
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                clearInterval(progressInterval);
                progressBar.style.width = '100%';
                
                const result = await response.json();
                
                if (result.success) {
                    progressText.textContent = 'Complete!';
                    setTimeout(() => {
                        uploadForm.style.display = 'none';
                        successAnimation.classList.add('show');
                    }, 500);
                } else {
                    showAlert(result.error || 'Upload failed', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Upload & Train Model';
                    progressContainer.classList.remove('show');
                }
            } catch (error) {
                showAlert('Network error: ' + error.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Upload & Train Model';
                progressContainer.classList.remove('show');
            }
        });
    </script>
</body>
</html>
